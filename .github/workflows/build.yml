on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  diagnose:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Fetch failed build log to branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          FAILED_JOB=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs --jq '.jobs[] | select(.conclusion=="failure") | .id' | head -1)
          echo "failed job: $FAILED_JOB"
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/$FAILED_JOB/logs > /tmp/full.log 2>&1
          sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/full.log > /tmp/clean.log
          echo "=== COMPILE ERRORS ===" > /tmp/diag.txt
          grep -n -iE "error:|undefined reference|implicit declaration|no member named|overflowed|region .* overflow|fatal error|FAILED" /tmp/clean.log | head -100 >> /tmp/diag.txt
          echo "" >> /tmp/diag.txt
          echo "=== LAST 80 LINES ===" >> /tmp/diag.txt
          tail -80 /tmp/clean.log >> /tmp/diag.txt
          mkdir -p /tmp/diagout
          cp /tmp/diag.txt "/tmp/diagout/build-error.txt"
          cd /tmp/diagout
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "diag: build error log" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin HEAD:diagnostics || echo "DIAG_PUSH_FAILED"

  publish:
    needs: build
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: ${{ runner.temp }}/fw
      - name: List downloaded files
        run: find "${{ runner.temp }}/fw" -type f -print
      - name: Publish UF2 files to firmware branch
        run: |
          set -e
          FWDIR="${{ runner.temp }}/fw"
          WORK="${{ runner.temp }}/pub"
          mkdir -p "$WORK"
          find "$FWDIR" -name '*.uf2' -exec cp {} "$WORK"/ \;
          ls -la "$WORK"
          cd "$WORK"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b firmware
          git add -A
          git commit -q -m "firmware: build artifacts" || { echo "commit failed"; exit 1; }
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin firmware:firmware
          echo "PUSH_OK"
