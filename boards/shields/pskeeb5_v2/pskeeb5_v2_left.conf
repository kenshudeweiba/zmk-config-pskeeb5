CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_SPI=y


# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Use the stock ZMK 8px Montserrat font: on this 1-bit OLED its strokes are
# exactly 1px, giving the same thin icon/line look as the original firmware.
# 12px/16px render 2-3px strokes and look "bold", so keep the default at 8px.
CONFIG_LV_FONT_MONTSERRAT_8=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=n
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y
CONFIG_ZMK_WIDGET_SYNC_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_SYNC_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_SYNC_BATTERY_STATUS=y

CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
CONFIG_ZMK_WIDGET_SYNC_INDICATORS_STATUS=y
# The custom status screen creates more widgets than the built-in one. Keep enough
# LVGL heap for the 5 second splash-to-status transition, especially with the mono theme.
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# Full-frame rendering + single VDB: required by the 90-degree flush transpose.
# Partial refreshes would hand the flush callback sub-regions that cannot be
# transposed independently.
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_MONOCHROME_CONVERSION_BUFFER=n

# CONFIG_ZMK_LOGGING_MINIMAL=y
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_MODE_IMMEDIATE=y
# CONFIG_PS2_LOG_LEVEL_DBG=y
# CONFIG_UART_LOG_LEVEL_DBG=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

# CONFIG_ZMK_STUDIO=y